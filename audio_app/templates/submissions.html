<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All Submissions — ConsultBae</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    max-width: 1100px;
    margin: 0 auto;
    padding: 60px 24px;
    min-height: 100vh;
    color: #eef1f8;
    background: linear-gradient(135deg, #0b0f1a 0%, #131a2e 40%, #1a1030 100%);
    background-size: 200% 200%;
    animation: bgShift 16s ease infinite;
    position: relative;
    overflow-x: hidden;
  }
  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .blob {
    position: fixed; border-radius: 50%; filter: blur(80px);
    opacity: 0.3; z-index: 0; animation: float 12s ease-in-out infinite;
  }
  .blob1 { width: 340px; height: 340px; background: #2dd4bf; top: -100px; left: -100px; }
  .blob2 { width: 300px; height: 300px; background: #7c3aed; bottom: -80px; right: -80px; animation-delay: 3s; }
  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-30px) scale(1.08); }
  }

  .content { position: relative; z-index: 1; }

  h1 {
    font-size: 1.9rem; font-weight: 700; margin-bottom: 4px;
    background: linear-gradient(90deg, #2dd4bf, #a78bfa);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .back-link {
    display: inline-block; margin: 8px 0 24px; color: #a78bfa;
    text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: color 0.2s;
  }
  .back-link:hover { color: #2dd4bf; }

  .table-card {
    background: rgba(23, 29, 43, 0.65);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    animation: cardIn 0.6s ease;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 14px 16px; font-size: 0.85rem; }
  thead th {
    color: #9aa5bd; font-weight: 700; text-transform: uppercase; font-size: 0.72rem;
    letter-spacing: 0.05em; border-bottom: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03);
  }
  tbody tr {
    border-bottom: 1px solid rgba(255,255,255,0.06);
    transition: background 0.15s;
  }
  tbody tr:hover { background: rgba(255,255,255,0.04); }
  tbody tr:last-child { border-bottom: none; }

  audio { height: 34px; max-width: 220px; }

  .pill {
    padding: 4px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700;
    text-transform: capitalize;
  }
  .pill.good { background: rgba(45,212,191,0.15); color: #2dd4bf; }
  .pill.acceptable { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .pill.poor { background: rgba(248,113,113,0.15); color: #f87171; }

  .empty { padding: 40px; text-align: center; color: #9aa5bd; }
</style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <div class="content">
    <h1>All Audio Submissions</h1>
    <a class="back-link" href="/">← Back to submit</a>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Name</th><th>Phone</th><th>Play</th><th>Duration</th>
            <th>Sample Rate</th><th>Bitrate</th><th>Loudness</th><th>Quality</th><th>Submitted</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

<script>
function qualityClass(q) {
  if (q.includes('good')) return 'good';
  if (q.includes('acceptable')) return 'acceptable';
  return 'poor';
}

async function load() {
  const res = await fetch('/api/submissions');
  const rows = await res.json();
  const tbody = document.getElementById('rows');
  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty">No submissions yet — go record one!</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${r.name}</td>
      <td>${r.phone}</td>
      <td><audio controls src="/uploads/${r.filename}"></audio></td>
      <td>${r.duration_sec}s</td>
      <td>${r.sample_rate_hz} Hz</td>
      <td>${r.bitrate_kbps} kbps</td>
      <td>${r.loudness_db.toFixed(1)} dB</td>
      <td><span class="pill ${qualityClass(r.quality_estimate)}">${r.quality_estimate}</span></td>
      <td>${r.submitted_at}</td>
    </tr>
  `).join('');
}
load();
</script>
</body>
</html>
